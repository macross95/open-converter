# Prueba Open Converter en Windows, macOS y Linux; al subir una etiqueta de versión también
# compila los instaladores de cada sistema y los deja en una Release ya publicada y marcada como
# última versión, con sus sumas SHA-256.
#
# Se ejecuta en cada subida de código (solo pruebas), a mano desde la pestaña Actions
# ("Compilar Open Converter" → Run workflow) o al subir una etiqueta igual a la versión de
# src/openconverter/__init__.py, por ejemplo:
#   git tag v0.4.0 && git push origin v0.4.0
#
# Seguridad: cada acción está fijada a un commit (el comentario dice su versión), el token es de
# solo lectura salvo en el trabajo que publica y checkout no deja credenciales guardadas.

name: Compilar Open Converter

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (${{ matrix.nombre }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: Windows, maquina: windows-latest, python: "3.12" }
          - { nombre: macOS, maquina: macos-latest, python: "3.12" }
          - { nombre: Ubuntu, maquina: ubuntu-22.04, python: "3.10" }
          - { nombre: Ubuntu, maquina: ubuntu-latest, python: "3.13" }
    runs-on: ${{ matrix.maquina }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libcairo2 tk

      - name: Instalar
        run: python -m pip install -e ".[heif,raw,avif,svg,extra,dev]"

      - name: Pruebas (Linux, con pantalla virtual)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q

      - name: Pruebas
        if: runner.os != 'Linux'
        run: python -m pytest -q

  compilar:
    name: Compilar (${{ matrix.nombre }})
    needs: pruebas
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: Windows, maquina: windows-latest, sistema: windows }
          - { nombre: Linux, maquina: ubuntu-22.04, sistema: linux }
          - { nombre: macOS (Apple Silicon), maquina: macos-latest, sistema: macos-arm64 }
          - { nombre: macOS (Intel), maquina: macos-15-intel, sistema: macos-x64 }
    runs-on: ${{ matrix.maquina }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias de sistema (Linux)
        if: matrix.sistema == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2 tk

      - name: Instalar
        run: python -m pip install -e ".[heif,raw,avif,svg,extra,dev]"

      - name: Versión
        id: version
        shell: bash
        run: echo "valor=$(python -c "import sys; sys.path.insert(0, 'src'); import openconverter; print(openconverter.__version__)")" >> "$GITHUB_OUTPUT"

      - name: Ejecutable (PyInstaller)
        shell: bash
        run: python -m PyInstaller "Open Converter.spec" --noconfirm --clean

      # ---------- Windows: instalador con el diseño del programa ----------
      - name: Instalador de Windows (Inno Setup)
        if: matrix.sistema == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force salida | Out-Null
          Copy-Item "installer_output\Open Converter-Setup-*.exe" salida\

      # ---------- macOS: .dmg con el atajo a Aplicaciones ----------
      - name: Imagen de disco de macOS (.dmg)
        if: startsWith(matrix.sistema, 'macos')
        env:
          VERSION: ${{ steps.version.outputs.valor }}
        run: |
          arq=$([ "${{ matrix.sistema }}" = "macos-arm64" ] && echo arm64 || echo x64)
          # Firma ad hoc: macOS en Apple Silicon no abre programas sin ninguna firma
          codesign --force --deep --sign - "dist/Open Converter.app"
          mkdir -p dmg salida
          cp -R "dist/Open Converter.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Open Converter" -srcfolder dmg -ov -format UDZO \
            "salida/Open-Converter-${VERSION}-macos-${arq}.dmg"

      # ---------- Linux: paquete .tar.gz con instalador para el usuario ----------
      - name: Paquete de Linux (.tar.gz)
        if: matrix.sistema == 'linux'
        env:
          VERSION: ${{ steps.version.outputs.valor }}
        run: |
          mkdir -p salida paquete
          cp -R dist/open-converter paquete/open-converter
          cp packaging/linux/install.sh packaging/linux/open-converter.desktop paquete/
          cp assets/logo.png paquete/open-converter.png
          tar -czf "salida/Open-Converter-${VERSION}-linux-x64.tar.gz" -C paquete .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-converter-${{ matrix.sistema }}
          if-no-files-found: error
          path: salida/*

  publicar:
    name: Release (publicada)
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Versión
        id: version
        run: echo "valor=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/openconverter/__init__.py)" >> "$GITHUB_OUTPUT"

      - name: La etiqueta coincide con la versión
        if: github.ref_type == 'tag'
        env:
          ETIQUETA: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.valor }}
        run: |
          if [ "$ETIQUETA" != "v$VERSION" ]; then
            echo "La etiqueta $ETIQUETA no coincide con la versión v$VERSION de src/openconverter/__init__.py"
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: instaladores
          merge-multiple: true

      - name: Sumas SHA-256 de los instaladores
        run: |
          cd instaladores
          find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} + | sed -E 's#  .*/#  #' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: github.ref_type == 'tag'
        with:
          tag_name: v${{ steps.version.outputs.valor }}
          target_commitish: ${{ github.sha }}
          name: Open Converter v${{ steps.version.outputs.valor }}
          draft: false
          make_latest: "true"
          files: instaladores/**/*
          body: |
            Open Converter, convertidor de imágenes multi-formato creado por MacrosS. En español e inglés.
            - **Windows 10 y 11:** `Open Converter-Setup-${{ steps.version.outputs.valor }}.exe`
            - **macOS 11 o superior:** `.dmg` (arm64 = Apple Silicon M1 a M4, x64 = Intel). Como el programa no está firmado con un certificado de Apple, la primera vez ábrelo con clic derecho → Abrir.
            - **Linux (Ubuntu 22.04 o superior y distribuciones similares):** `.tar.gz`. Descomprime y ejecuta `./install.sh`.

            Verifica tu descarga con `SHA256SUMS.txt` (por ejemplo `sha256sum -c SHA256SUMS.txt --ignore-missing`).
