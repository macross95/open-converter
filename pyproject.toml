[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openconverter"
version = "0.4.0"
description = "Open Converter: convertidor de imágenes multi-formato con ventana y línea de comandos."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "MacrosS" }]
keywords = ["image", "converter", "webp", "heic", "batch"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
  "Pillow>=10.0.0",
  "customtkinter>=5.2.0",
  "tkinterdnd2>=0.4.0",
]

[project.optional-dependencies]
heif = ["pillow-heif>=0.16.0"]
raw = ["rawpy>=0.19.0"]
avif = ["pillow-avif-plugin>=1.4.0"]
svg = ["cairosvg>=2.7.0"]
extra = ["imageio>=2.30.0"]
all = ["pillow-heif>=0.16.0", "rawpy>=0.19.0", "pillow-avif-plugin>=1.4.0", "cairosvg>=2.7.0", "imageio>=2.30.0"]
dev = ["pytest>=8.0.0", "ruff>=0.5.0", "pyinstaller>=6.0.0"]

[project.scripts]
openconverter = "openconverter.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
